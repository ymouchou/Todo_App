<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: base(~{::content}, 'TodoApp - Mes tâches', 'mes-taches')}">
<div th:fragment="content" class="container py-4">
    <h1 class="mb-4">
        <i class="bi bi-list-check"></i> Mes tâches
    </h1>

    <div th:if="${utilisateurActif == null}" class="alert alert-warning" role="alert">
        <i class="bi bi-exclamation-triangle"></i>
        Aucun utilisateur sélectionné. Veuillez choisir un utilisateur dans le menu supérieur.
    </div>

    <div th:if="${utilisateurActif != null}">
        <div class="alert alert-info">
            <i class="bi bi-person-circle"></i> Tâches de
            <strong th:text="${utilisateurActif.prenom + ' ' + utilisateurActif.nom}"></strong>
        </div>

        <div th:if="${#lists.isEmpty(taches)}" class="alert alert-secondary">
            <i class="bi bi-info-circle"></i> Aucune tâche enregistrée pour cet utilisateur.
        </div>

        <div th:if="${not #lists.isEmpty(taches)}" class="card shadow-sm">
            <div class="card-header">
                <h2 class="h5 mb-0">
                    <i class="bi bi-card-checklist"></i> Liste des tâches
                    <span class="badge text-bg-secondary" th:text="${#lists.size(taches)}"></span>
                </h2>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Identifiant</th>
                            <th>Titre</th>
                            <th>Description</th>
                            <th>Date de création</th>
                            <th>Échéance</th>
                            <th>État</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="tache : ${taches}">
                            <td th:text="${tache.idTache}"></td>
                            <td th:text="${tache.titre}"></td>
                            <td th:text="${tache.description != null ? tache.description : '-'}"></td>
                            <td th:text="${#temporals.format(tache.dateCreation, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${tache.dateEcheance != null ? #temporals.format(tache.dateEcheance, 'dd/MM/yyyy') : '-'}"></td>
                            <td>
                                    <span class="badge"
                                          th:classappend="${tache.terminee} ? 'text-bg-success' : 'text-bg-warning'"
                                          th:text="${tache.terminee} ? 'Terminée' : 'En cours'">
                                    </span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
