<div xmlns:th="http://www.thymeleaf.org">
    <nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg p-0">
        <div class="container-fluid p-0">
            <!-- Bouton de navigation pour les petits écrans -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarTodoApp"
                    aria-controls="navbarTodoApp"
                    aria-expanded="false"
                    aria-label="Afficher la navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Liens de navigation -->
            <div class="collapse navbar-collapse" id="navbarTodoApp">
                <ul class="navbar-nav">
                    <!-- Accueil -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/}"
                           th:classappend="${activePage} == 'accueil' ? ' active' : ''">
                            <i class="bi bi-house-door"></i>
                            Accueil
                        </a>
                    </li>
                    <!-- Mes tâches -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/mes-taches}"
                           th:classappend="${activePage} == 'mes-taches' ? ' active' : ''">
                            <i class="bi bi-list-check"></i>
                            Mes tâches
                        </a>
                    </li>
                    <!-- Mes informations -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/mes-infos}"
                           th:classappend="${activePage} == 'mes-infos' ? ' active' : ''">
                            <i class="bi bi-person-circle"></i>
                            Mes infos
                        </a>
                    </li>
                    <!-- Groupe Administration -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle"
                           href="#"
                           th:classappend="${activePage != null and activePage.startsWith('admin/')} ? 'active' : ''"
                           id="navbarAdmin"
                           role="button"
                           data-bs-toggle="dropdown"
                           aria-expanded="false">
                            <i class="bi bi-gear"></i>
                            Administration
                        </a>
                        <!-- Menu déroulant -->
                        <ul class="dropdown-menu"
                            aria-labelledby="navbarAdmin">
                            <li> <!-- Gestion des tâches -->
                                <a class="dropdown-item"
                                   th:href="@{/admin/taches}"
                                   th:classappend="${activePage} == 'admin/taches' ? ' active' : ''">
                                    <i class="bi bi-list-task"></i>
                                    Gestion des tâches
                                </a>
                            </li>
                            <li> <!-- Gestion des utilisateurs -->
                                <a class="dropdown-item"
                                   th:href="@{/admin/utilisateurs}"
                                   th:classappend="${activePage} == 'admin/utilisateurs' ? ' active' : ''">
                                    <i class="bi bi-people"></i>
                                    Gestion des utilisateurs
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>
