<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: base(~{::content}, 'TodoApp - Tâches', 'admin/taches')}">
<div th:fragment="content" class="container py-4">
    <h1 class="mb-4">
        <i class="bi bi-card-checklist"></i> Gestion des tâches
    </h1>
    <p class="text-muted">
        Liste de l'ensemble des tâches enregistrées dans l'application TodoApp.
    </p>

    <div th:if="${#lists.isEmpty(listeTaches)}" class="alert alert-info" role="alert">
        <i class="bi bi-info-circle"></i> Aucune tâche enregistrée.
    </div>

    <div th:if="${not #lists.isEmpty(listeTaches)}" class="card shadow-sm">
        <div class="card-header">
            <h2 class="h5 mb-0">
                <i class="bi bi-list-task"></i> Liste des tâches
                <span class="badge text-bg-secondary" th:text="${#lists.size(listeTaches)}"></span>
            </h2>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Identifiant</th>
                        <th>Titre</th>
                        <th>Description</th>
                        <th>Utilisateur</th>
                        <th>Date de création</th>
                        <th>Échéance</th>
                        <th>État</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="tache : ${listeTaches}">
                        <td th:text="${tache.idTache}"></td>
                        <td th:text="${tache.titre}"></td>
                        <td th:text="${tache.description != null ? tache.description : '-'}"></td>
                        <td>
                            <i class="bi bi-person"></i>
                            <span th:text="${tache.utilisateur.prenom + ' ' + tache.utilisateur.nom}"></span>
                        </td>
                        <td th:text="${#temporals.format(tache.dateCreation, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${tache.dateEcheance != null ? #temporals.format(tache.dateEcheance, 'dd/MM/yyyy') : '-'}"></td>
                        <td>
                                <span class="badge"
                                      th:classappend="${tache.terminee} ? 'text-bg-success' : 'text-bg-warning'"
                                      th:text="${tache.terminee} ? 'Terminée' : 'En cours'">
                                </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</html>
